---
layout: default
title: "Muneer's Projects"
---
<div class="projects-page">
  <h1>Projects</h1>
  <div class="project-grid">
    {% for project in site.data.projects %}
    <article class="project-card">
      <h2>{{ project.name | escape }}</h2>
      <div class="project-meta">{{ project.tech | escape }}</div>
      <ul class="project-bullets">
        {% for b in project.bullets %}<li>{{ b | escape }}</li>{% endfor %}
      </ul>
    </article>
    {% endfor %}
  </div>
</div>
